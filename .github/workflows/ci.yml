name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector (Linux only, slow with the Japanese dictionary)
        if: runner.os == 'Linux'
        run: go test -race ./...

  packages:
    name: Language packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build osmem-server for this host
        run: scripts/build-binaries.sh host
      - name: Expose the binary to the package tests
        run: echo "OSMEM_SERVER_BIN=$PWD/dist/linux-amd64/osmem-server" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node.js package
        working-directory: packages/node/core
        run: npm test

      - uses: astral-sh/setup-uv@v5
      - name: Python package
        working-directory: packages/python
        run: uv run --no-project --with pytest --with-editable . pytest -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Java package (compiles the JUnit extension and runs its tests)
        working-directory: packages/java
        run: mvn --batch-mode --no-transfer-progress test
      - name: Java javadoc and sources (what the release profile publishes)
        working-directory: packages/java
        run: mvn --batch-mode --no-transfer-progress -DskipTests package source:jar-no-fork javadoc:jar

  java-release:
    name: Java release profile (sign and bundle, no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build the classifier jars for the pom version
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' packages/java/pom.xml | head -1)
          echo "version $VERSION"
          VERSION=$VERSION scripts/build-java-binaries.sh
      - name: Throwaway signing key
        run: gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "osmem ci <ci@example.invalid>" rsa3072 sign 1d
      - name: Package, sign and stage the Central bundle (deploy phase is not reached)
        working-directory: packages/java
        run: mvn --batch-mode --no-transfer-progress -Prelease -DskipTests verify
      - name: Every artifact has a signature
        working-directory: packages/java
        run: |
          # maven-gpg-plugin may write the .asc next to the file or under target/gpg
          for f in binaries/target/binaries/*.jar osmem/target/*.jar; do
            module=${f%%/target/*}
            sig=$(find "$module/target" -name "$(basename "$f").asc" | head -1)
            test -n "$sig" || { echo "missing signature for $f"; exit 1; }
            echo "$f -> $sig"
          done
