name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector (Linux only, slow with the Japanese dictionary)
        if: runner.os == 'Linux'
        run: go test -race ./...

  packages:
    name: Language packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build osmem-server for this host
        run: scripts/build-binaries.sh host
      - name: Expose the binary to the package tests
        run: echo "OSMEM_SERVER_BIN=$PWD/dist/linux-amd64/osmem-server" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node.js package
        working-directory: packages/node/osmem
        run: npm test

      - uses: astral-sh/setup-uv@v5
      - name: Python package
        working-directory: packages/python
        run: uv run --no-project --with pytest --with-editable . pytest -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Java package (compiles the JUnit extension and runs its tests)
        working-directory: packages/java
        run: mvn --batch-mode --no-transfer-progress test
