name: Release

# Tag a commit as vX.Y.Z to build every artifact and publish:
#   - GitHub Release with the binaries, wheels and Java jars attached
#   - npm: @osmem/<platform> packages, then @osmem/core, via trusted
#     publishing (OIDC): each package must exist and list this repository,
#     release.yml and the "release" environment as a trusted publisher on
#     npmjs.com. The first version of each package is published manually
#     with 2FA (see README "Releasing").
#   - PyPI: platform wheels via trusted publishing (configure the
#     "release" environment on PyPI for this repository)
#   - Maven Central: io.github.shibukawa.osmem:osmem and :osmem-server-binaries
#     (classifier jars) through the Central Publisher Portal; needs the
#     CENTRAL_USERNAME / CENTRAL_PASSWORD (portal user token) and
#     GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp package versions
        run: scripts/set-version.sh "${{ steps.version.outputs.version }}"
      - name: Build binaries and packages
        run: |
          VERSION=${{ steps.version.outputs.version }} scripts/build-npm.sh
          VERSION=${{ steps.version.outputs.version }} scripts/build-java-binaries.sh
      - uses: astral-sh/setup-uv@v5
      - name: Build wheels
        run: VERSION=${{ steps.version.outputs.version }} scripts/build-python-wheels.sh
      - name: Archive binaries
        run: |
          cd dist
          for d in *-*/; do d=${d%/}; tar -C "$d" -czf "osmem-server-${{ steps.version.outputs.version }}-$d.tar.gz" .; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/wheels/*.whl
            dist/java/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: packages/node
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/wheels/*.whl
            dist/java/*.jar

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC trusted publishing; no NPM_TOKEN
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: packages/node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 is required for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Publish platform packages, then @osmem/core (skipping versions already on npm)
        run: |
          publish() {
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              return
            fi
            npm publish --access public --provenance
          }
          for d in packages/node/platforms/*/; do
            chmod +x "$d"/bin/* || true
            (cd "$d" && publish)
          done
          (cd packages/node/core && publish)

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels

  maven:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stamp package versions
        run: scripts/set-version.sh "${{ needs.build.outputs.version }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        working-directory: packages/java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease -DskipTests deploy
